name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify syntax and manifests
        run: |
          node --check lib/client.js
          node --check lib/index.js
          node -e "for (const f of ['package.json','locale/zh.json','locale/en.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"

      - name: Check bundle manifest
        run: |
          node -e "
          const p = require('./package.json');
          const need = ['name','version','type','main','exports','dsh'];
          for (const k of need) if (!(k in p)) { console.error('missing ' + k); process.exit(1); }
          if (!p.dsh.bundle || !p.dsh.bundle.patch) { console.error('missing dsh.bundle.patch'); process.exit(1); }
          if (!p.dsh.client || p.dsh.client.platform !== 'web') { console.error('missing dsh.client platform'); process.exit(1); }
          if (!p.exports['./client']) { console.error('missing ./client export'); process.exit(1); }
          console.log('manifest ok: ' + p.name + '@' + p.version);
          "

  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Check npm token
        id: token
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::notice title=NPM_TOKEN not configured::Skipping npm publish. Add a repository secret named NPM_TOKEN to publish releases automatically."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        id: publish
        if: steps.token.outputs.present == 'true'
        continue-on-error: true
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Explain npm failure
        if: steps.publish.outcome == 'failure'
        run: |
          echo "::error title=npm publish failed::See the Publish step log above for the npm error code."
          cat <<'MSG'
          If the log says:

            403 Two-factor authentication or granular access token with bypass 2fa enabled is required

          then NPM_TOKEN is a token type that cannot publish non-interactively. Fix by creating either:

            * Classic token, type "Automation"   (recommended; 2FA is bypassed for CI), or
            * Granular access token with "Bypass 2FA" enabled and read/write on this package

          at https://www.npmjs.com/settings/~/tokens and updating the repository secret:

            gh secret set NPM_TOKEN --repo <owner>/<repo>

          Then re-run this workflow (Actions -> publish -> Run workflow).
          MSG

      - name: Fail when publish did not succeed
        if: steps.publish.outcome == 'failure'
        run: exit 1
